services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - api/.env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - api-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - api/.env
    environment:
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/src/worker.js"]
    volumes:
      - api-data:/app/data
      - worker-tmp:/app/work
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 3G

volumes:
  redis-data:
  api-data:
  worker-tmp:
